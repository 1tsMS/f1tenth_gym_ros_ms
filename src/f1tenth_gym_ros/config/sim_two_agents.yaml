# Configuration for 2-Car Head-to-Head Racing in F1TENTH Gym

bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.275
    
    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # map parameters
    map_path: '/sim_ws/src/f1tenth_gym_ros/maps/levine'
    map_img_ext: '.png'

    # 2 agents for head-to-head racing
    num_agent: 2

    # ego starting pose on map (start line)
    sx: 0.0
    sy: 0.0
    stheta: 0.0

    # opp starting pose on map (3.5m ahead on track)
    sx1: 3.5
    sy1: 0.0
    stheta1: 0.0

    # teleop
    kb_teleop: True

